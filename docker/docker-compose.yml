services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lluser
      POSTGRES_PASSWORD: llpass
      POSTGRES_DB: ll_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lluser -d ll_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  ll-student-net:
    name: ll-student-net
    driver: bridge
